worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/nginx-body;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    proxy_temp_path /tmp/nginx-proxy;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_x_forwarded_proto $hsts {
        https "max-age=15552000";
    }

    server {
        listen 8080 default_server;
        root /var/www/html;
        client_max_body_size 32m;
        add_header Strict-Transport-Security $hsts always;

        # Same deny rules as the ZIP's .htaccess.
        location ~ ^/(?:wgw-content|wgw-plugins|packages)(?:/|$) {
            return 404;
        }
        location ~ ^/\.(?:git|svn|hg|env|htaccess|htpasswd|user\.ini)(?:[/.]|$) {
            return 404;
        }
        location ~ ^/wgw-config\.php\.bak(?:\.|$) {
            return 404;
        }
        location ~* ^/(?:wgw-src|src|resources|vendor|scripts|patches|config|public)(?:/|$) {
            return 403;
        }
        location ~* ^/(?:composer\.(?:json|lock)|package\.json|wgw-config(?:\.sample)?\.php(?:\.bak(?:\.[^/]*)?)?|\.env)$ {
            return 403;
        }

        location = /index.html {
            add_header Strict-Transport-Security $hsts always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/v1/csp-reports" always;
        }

        # gzip only static files, never PHP responses (BREACH).
        location /assets/ {
            gzip on;
            gzip_vary on;
            gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
            location ~ "-[\w-]{8}\.\w+$" {
                add_header Strict-Transport-Security $hsts always;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }
        }

        location / {
            try_files $uri @php;
        }

        location @php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass 127.0.0.1:9000;
        }
    }
}
